<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" width="1024" height="1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00dfb7"/>
      <stop offset="0.45" stop-color="#05997f"/>
      <stop offset="1" stop-color="#04574b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#046455"/>
      <stop offset="1" stop-color="#012a25"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfefe"/>
      <stop offset="0.6" stop-color="#f1fbfa"/>
      <stop offset="1" stop-color="#d6f5f2"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5f54"/>
      <stop offset="0.5" stop-color="#05473f"/>
      <stop offset="1" stop-color="#022e29"/>
    </linearGradient>
    <linearGradient id="glyphSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03352e"/>
      <stop offset="1" stop-color="#011a17"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0aa88c"/>
      <stop offset="1" stop-color="#03403a"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#078a73"/>
      <stop offset="1" stop-color="#12b394"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dy="40"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="6" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feSpecularLighting in="b" surfaceScale="6" specularConstant="0.9" specularExponent="22" lighting-color="#d8fff5" result="s">
        <feDistantLight azimuth="235" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
    </filter>
    <clipPath id="panelClip"><rect x="95" y="105" width="1065" height="1010" rx="235"/></clipPath>

    <g id="shapes">
      <polygon points="250,383 326,383 326,467 522,280 570,328 232,667 132,667 248,547"/>
      <polygon points="668,278 778,385 980,590 915,630 662,375 368,667 268,667"/>
      <polygon points="778,385 895,340 940,345 820,425"/>
      <path d="M762 255 C805 222 868 236 897 288 L955 290 L1010 338 L972 378 L940 346 L898 342 L860 300 C830 262 795 250 762 255 Z"/>
      <polygon points="905,378 1053,528 1003,572 862,428"/>
      <rect x="600" y="518" width="52" height="52"/>
      <rect x="673" y="518" width="52" height="52"/>
      <rect x="600" y="590" width="52" height="52"/>
      <rect x="673" y="590" width="52" height="52"/>
      <circle cx="858" cy="858" r="28"/>
      <circle cx="958" cy="858" r="28"/>
    </g>
    <g id="cartLines" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
      <path d="M748 672 H798 L838 800 H990 L1030 706 H820"/>
      <path d="M651 733 H770 M630 776 H782 M662 822 H792" stroke-width="17"/>
    </g>
    <path id="swooshL" d="M218 685 C170 735 170 790 235 810 C330 840 500 790 612 752 C590 780 572 790 560 797 C430 835 300 850 230 830 C150 805 160 735 218 685 Z"/>
    <path id="swooshR" d="M1080 392 C1150 420 1150 485 1090 540 C1030 600 950 640 868 678 C960 650 1050 600 1100 520 C1130 470 1120 420 1080 392 Z"/>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="625" cy="1215" rx="470" ry="30" fill="#000" opacity="0.25" filter="url(#softShadow)"/>

  <g filter="url(#bigShadow)">
    <!-- extruded body (depth) -->
    <rect x="55" y="105" width="1145" height="1110" rx="270" fill="url(#side)"/>
    <!-- front face rim -->
    <rect x="55" y="60" width="1145" height="1110" rx="270" fill="url(#rim)"/>
    <rect x="68" y="72" width="1119" height="1086" rx="258" fill="none" stroke="#7ff5da" stroke-opacity="0.55" stroke-width="5"/>
    <!-- inner recessed panel -->
    <rect x="95" y="100" width="1065" height="1015" rx="235" fill="#02463c"/>
    <rect x="100" y="108" width="1055" height="1005" rx="230" fill="url(#panel)"/>
  </g>

  <g clip-path="url(#panelClip)">
    <!-- bottom wave -->
    <path d="M95 1115 V1090 C300 1090 420 1020 700 965 C940 918 1090 880 1160 800 V1115 Z" fill="url(#wave)"/>
    <path d="M425 1115 C560 1020 780 970 1160 870 V1115 Z" fill="#022e28" opacity="0.9"/>
    <path d="M240 1085 C420 1005 640 985 900 930 C1030 900 1110 860 1160 800" fill="none" stroke="#5bf2d3" stroke-opacity="0.6" stroke-width="5"/>
    <!-- inner shadow on panel top-left -->
    <rect x="95" y="100" width="1065" height="1015" rx="235" fill="none" stroke="#0a8e76" stroke-opacity="0.25" stroke-width="26"/>
  </g>

  <!-- glyphs: depth layers -->
  <g fill="url(#glyphSide)" stroke="url(#glyphSide)" stroke-linejoin="round">
    <g transform="translate(14,22)"><use href="#shapes"/><use href="#swooshL" fill="#024a40"/><use href="#swooshR" fill="#024a40"/><use href="#cartLines" stroke="#012a25"/></g>
    <g transform="translate(9,14)"><use href="#shapes"/><use href="#swooshL" fill="#035a4d"/><use href="#swooshR" fill="#035a4d"/><use href="#cartLines" stroke="#02332d"/></g>
  </g>
  <!-- glyphs: front -->
  <g filter="url(#softShadow)">
    <g filter="url(#bevel)">
      <use href="#shapes" fill="url(#glyph)"/>
      <use href="#cartLines" stroke="url(#glyph)"/>
      <use href="#swooshL" fill="url(#swoosh)"/>
      <use href="#swooshR" fill="url(#swoosh)"/>
    </g>
  </g>

  <!-- window highlights -->
  <g fill="#fff" opacity="0.35">
    <rect x="604" y="522" width="44" height="14"/><rect x="677" y="522" width="44" height="14"/>
  </g>

  <!-- glossy highlight on tile -->
  <g clip-path="url(#panelClip)">
    <ellipse cx="480" cy="150" rx="520" ry="190" fill="url(#gloss)" opacity="0.55"/>
  </g>
  <rect x="55" y="60" width="1145" height="1110" rx="270" fill="url(#glow)" opacity="0.12"/>
</svg>
